server:
  port: 8091

spring:
  application:
    name: submission-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cosmoscan_submission}
    username: ${SPRING_DATASOURCE_USERNAME:cosmoscan}
    password: ${SPRING_DATASOURCE_PASSWORD:cosmoscan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    # Paths via API Gateway (StripPrefix=/swagger/{service}); override for direct :8091 access
    config-url: ${SPRINGDOC_SWAGGER_UI_CONFIG_URL:/swagger/submission/v3/api-docs/swagger-config}
    url: ${SPRINGDOC_SWAGGER_UI_URL:/swagger/submission/v3/api-docs}
  show-actuator: false

cosmoscan:
  clients:
    file-storing-base-url: ${FILE_STORING_BASE_URL:http://localhost:8092}
    analysis-base-url: ${ANALYSIS_BASE_URL:http://localhost:8093}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
