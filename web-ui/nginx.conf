server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        autoindex off;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/json;
}
