import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// Executable Spring Boot applications (get bootJar)
def bootServices = ['gateway', 'submission-service', 'file-storing-service', 'analysis-service']
// Modules whose unit tests must cover 100% of instructions, lines and branches
def fullyCoveredModules = bootServices + ['file-validation']

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.cosmoscan'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.springdoc:springdoc-openapi:2.6.0'
        }
    }
}

configure(subprojects.findAll { it.name in bootServices }) {
    apply plugin: 'org.springframework.boot'
}

configure(subprojects.findAll { it.name in fullyCoveredModules }) {
    apply plugin: 'jacoco'

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy 'jacocoTestReport'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        dependsOn test
        violationRules {
            rule {
                ['INSTRUCTION', 'LINE', 'BRANCH'].each { coverageCounter ->
                    limit {
                        counter = coverageCounter
                        minimum = 1.0
                    }
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn 'jacocoTestCoverageVerification'
    }
}

tasks.register('copyJacocoReportsForWeb', Copy) {
    group = 'reporting'
    description = 'Copies JaCoCo HTML reports into web-ui/reports for the user portal'
    def reported = ['submission-service': 'submission', 'file-storing-service': 'files',
                    'analysis-service': 'analysis', 'gateway': 'gateway', 'file-validation': 'file-validation']
    dependsOn reported.keySet().collect { ":${it}:jacocoTestReport" }
    into layout.projectDirectory.dir('web-ui/reports')
    reported.each { module, folder ->
        from(project(":${module}").layout.buildDirectory.dir('reports/jacoco/test/html')) {
            into folder
        }
    }
}

// Diagrams shown on the portal: web-ui/diagrams/plantuml/*.puml -> web-ui/assets/images/*.png
repositories {
    mavenCentral()
}

configurations {
    plantuml
}

dependencies {
    plantuml 'net.sourceforge.plantuml:plantuml:1.2024.7'
}

tasks.register('renderDiagrams', JavaExec) {
    group = 'documentation'
    description = 'Renders the PlantUML diagrams of the portal to PNG'
    classpath = configurations.plantuml
    mainClass = 'net.sourceforge.plantuml.Run'
    def sources = fileTree('web-ui/diagrams/plantuml') { include '*.puml' }
    inputs.files sources
    outputs.dir 'web-ui/assets/images'
    args(['-tpng', '-charset', 'UTF-8', '-o', file('web-ui/assets/images').absolutePath] + sources.files*.absolutePath)
}
