server:
  port: 8093

spring:
  application:
    name: analysis-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/cosmoscan_analysis}
    username: ${SPRING_DATASOURCE_USERNAME:cosmoscan}
    password: ${SPRING_DATASOURCE_PASSWORD:cosmoscan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    config-url: ${SPRINGDOC_SWAGGER_UI_CONFIG_URL:/swagger/analysis/v3/api-docs/swagger-config}
    url: ${SPRINGDOC_SWAGGER_UI_URL:/swagger/analysis/v3/api-docs}
  show-actuator: false

cosmoscan:
  analysis:
    file-storing-base-url: ${FILE_STORING_BASE_URL:http://localhost:8092}
    reports-path: ${STORAGE_REPORTS_PATH:./storage/reports}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
