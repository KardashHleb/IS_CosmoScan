server:
  port: 8092

spring:
  application:
    name: file-storing-service
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    config-url: ${SPRINGDOC_SWAGGER_UI_CONFIG_URL:/swagger/files/v3/api-docs/swagger-config}
    url: ${SPRINGDOC_SWAGGER_UI_URL:/swagger/files/v3/api-docs}
  show-actuator: false

cosmoscan:
  storage:
    files-path: ${STORAGE_FILES_PATH:./storage/files}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
